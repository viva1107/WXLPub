# 在 GitHub 上自动打包 phy2 编辑器 EXE
# 放到仓库 .github/workflows/build-phy2-editor.yml, 推上去即自动出 EXE
name: Build phy2-editor EXE
on:
  push:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --name phy2-edit --add-data "phy2_edit.py;." phy2_dd/phy2_edit_dd.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: phy2-edit
          path: dist/phy2-edit.exe
